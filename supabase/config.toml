# TEMPORÁRIO: Supabase local, ainda usado pelas telas para ler os dados até a #27 (o login já é Better Auth).
# As migrations agora ficam em db/migrations.
#
# Configuração do Supabase local (`npx supabase start`).
# Só o que difere do padrão da CLI; o resto vem dos valores padrão.
# Mantenha o project_id: é ele que liga este arquivo aos contêineres e ao volume do banco.
project_id = "nosso-dia"

[api]
port = 54321
# Endereço que o navegador usa para chegar na API (vai nos links dos e-mails de auth).
# Acessando de outro computador, troque 127.0.0.1 pelo nome/IP da máquina (ex.: http://homeserver:54321).
external_url = "http://127.0.0.1:54321"

[db]
port = 54322

[studio]
port = 54323

[auth]
# Precisa bater com NEXT_PUBLIC_SITE_URL. De outro computador: http://homeserver:3000
site_url = "http://localhost:3000"
# Para onde os links de e-mail podem voltar (o app usa /auth/callback?next=...).
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**", "http://homeserver:3000/**"]

[auth.email]
# Em desenvolvimento não precisa confirmar o e-mail para entrar.
enable_confirmations = false
